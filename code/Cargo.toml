[package]
name = "sys-design"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for generating and validating C4 architecture diagrams"
license = "MIT"
authors = ["Architecture Team"]

[lints.rust]
warnings = "deny"

[[bin]]
name = "sys-design"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "color"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
regex = "1.10"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
